short_bio: >-
  <p>
    My research interests focus on  *C^*-algebras and L^p-operator algebras*, especially when they are simple and have a unique trace. 
    I am currently pursuing my doctoral studies under the supervision of <a href="http://math.uwb.edu.pl/~zaf/kwasniewski" target="_blank">Bartosz Kwaśniewski</a>.
  </p>
  <p>
    Outside of mathematics, I enjoy doing DIY projects, cooking, and watching TV series, which helps me clear my mind and recharge.
  </p>

